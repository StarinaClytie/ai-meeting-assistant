<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI 会议纪要助手</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">GroupMeeting AI</p>
            <h1 data-i18n="appTitle">AI 会议纪要助手</h1>
          </div>
          <div class="topbar-actions">
            <div class="language-switch" role="group" aria-label="Language">
              <button type="button" data-language="zh-CN" aria-pressed="true">中文</button>
              <button type="button" data-language="en" aria-pressed="false">EN</button>
            </div>
            <div class="status-pill" id="systemStatus" data-i18n="localFlow">本地流程</div>
          </div>
        </header>

        <section class="panel upload-panel collapsible-panel" data-panel="upload">
          <div class="section-heading">
            <span class="step-index">1</span>
            <div>
              <h2 data-i18n="uploadTitle">录音或上传</h2>
              <p data-i18n="uploadDescription">上传一段会议音频，创建待转写会议。</p>
            </div>
            <button class="panel-toggle" type="button" data-toggle-panel="upload" aria-expanded="true" data-i18n="collapse">收起</button>
          </div>

          <div class="panel-body">
            <div class="recording-strip">
              <button class="icon-button primary" id="recordButton" type="button" aria-label="开始录音" title="开始录音" data-i18n-aria-label="startRecording" data-i18n-title="startRecording">
                <span id="recordIcon">●</span>
              </button>
              <div class="timer" id="recordTimer">00:00</div>
              <audio id="audioPreview" controls hidden></audio>
            </div>

            <div class="form-grid">
              <label>
                <span data-i18n="meetingTitleLabel">会议标题</span>
                <input id="meetingTitle" type="text" placeholder="例如：7月课题组周会" data-i18n-placeholder="meetingTitlePlaceholder">
              </label>
              <div class="form-field">
                <span data-i18n="audioFileLabel">音频文件</span>
                <input class="visually-hidden" id="audioFile" type="file" accept="audio/*">
                <label class="file-picker" for="audioFile">
                  <span class="file-picker-button" data-i18n="chooseAudio">选择音频</span>
                  <span class="file-picker-name" id="audioFileName" data-i18n="noFileSelected">未选择文件</span>
                </label>
              </div>
            </div>
            <label class="path-field" id="localPathField">
              <span data-i18n="localPathLabel">本机音频路径（大文件推荐）</span>
              <input id="localAudioPath" type="text" placeholder="/Users/&lt;username&gt;/Downloads/meeting-audio.wav" data-i18n-placeholder="localPathPlaceholder">
            </label>
            <div class="vocabulary-field">
              <div>
                <span data-i18n="hotwordsLabel">本次会议热词</span>
                <button class="info-button" type="button" aria-label="热词说明" title="热词会提示转写模型优先识别这些专业词、人名、缩写或设备名。只对本次会议生效，清空后不会带入新会议。" data-i18n-aria-label="hotwordsHelpLabel" data-i18n-title="hotwordsHelp">i</button>
              </div>
              <button class="button" id="openVocabularyButton" type="button" data-i18n="addHotwords">添加本次会议热词</button>
              <span class="vocabulary-count" id="vocabularyCount">0 个热词</span>
            </div>
            <p class="hint" id="localPathHint" data-i18n="localPathHint">超过 100MB 的音频建议填本机路径创建会议，避免浏览器上传卡住。</p>

            <div class="button-row">
              <button class="button primary" id="createMeetingButton" type="button" data-i18n="createMeeting">创建会议</button>
              <button class="button ghost" id="refreshButton" type="button" data-i18n="refreshList">刷新列表</button>
            </div>
          </div>
        </section>

        <section class="panel collapsible-panel" data-panel="transcript">
          <div class="section-heading">
            <span class="step-index">2</span>
            <div>
              <h2 data-i18n="transcriptTitle">转写与说话人标注</h2>
              <p data-i18n="transcriptDescription">FunASR 输出 speaker 编号后，在这里绑定真实姓名并校正文案。</p>
            </div>
            <button class="panel-toggle" type="button" data-toggle-panel="transcript" aria-expanded="true" data-i18n="collapse">收起</button>
          </div>

          <div class="panel-body">
            <div class="meeting-bar">
              <select id="meetingSelect" aria-label="选择会议" data-i18n-aria-label="selectMeeting"></select>
              <button class="button" id="transcribeButton" type="button" data-i18n="startTranscription">开始转写</button>
              <button class="button" id="saveSegmentsButton" type="button" data-i18n="saveLabels">保存标注</button>
            </div>

            <div class="progress-card" id="transcriptionProgress" hidden>
              <div class="progress-head">
                <strong id="progressStage">准备转写</strong>
                <span id="progressPercent">0%</span>
              </div>
              <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
              </div>
            </div>

            <div class="speaker-map" id="speakerMap"></div>
            <div class="segments" id="segments"></div>
          </div>
        </section>

        <section class="panel collapsible-panel" data-panel="summary">
          <div class="section-heading">
            <span class="step-index">3</span>
            <div>
              <h2 data-i18n="summaryTitle">生成会议总结</h2>
              <p data-i18n="summaryDescription">选择内容类型后生成核心结论、智能章节、明确待办、决策和金句。</p>
            </div>
            <button class="panel-toggle" type="button" data-toggle-panel="summary" aria-expanded="true" data-i18n="collapse">收起</button>
          </div>
          <div class="panel-body">
            <div class="summary-settings">
              <label>
                <span data-i18n="summaryTemplateLabel">总结模板</span>
                <select id="summaryTemplate">
                  <option value="auto" data-i18n="templateAuto">自动识别</option>
                  <option value="teaching" data-i18n="templateTeaching">课程 / 作业讲解</option>
                  <option value="research" data-i18n="templateResearch">科研组会</option>
                  <option value="project" data-i18n="templateProject">项目会议</option>
                  <option value="general" data-i18n="templateGeneral">通用讨论</option>
                  <option value="custom" data-i18n="templateCustom">自定义要求</option>
                </select>
              </label>
              <label id="customPromptField" hidden>
                <span data-i18n="customPromptLabel">本次总结要求</span>
                <textarea id="customSummaryPrompt" rows="3" maxlength="3000" placeholder="例如：重点整理实验参数、失败原因和下周需要验证的假设" data-i18n-placeholder="customPromptPlaceholder"></textarea>
              </label>
            </div>
            <div class="button-row">
              <button class="button primary" id="summarizeButton" type="button" data-i18n="generateSummary">生成总结</button>
              <button class="button" id="editSummaryButton" type="button" hidden data-i18n="editMinutes">编辑纪要</button>
              <button class="button primary" id="saveSummaryButton" type="button" hidden data-i18n="saveChanges">保存修改</button>
              <button class="button ghost" id="cancelSummaryButton" type="button" hidden data-i18n="cancelEdit">取消编辑</button>
              <details class="export-menu" id="exportMenu">
                <summary class="button"><span data-i18n="export">导出</span><span class="menu-chevron" aria-hidden="true"></span></summary>
                <div class="export-menu-options">
                  <button id="exportDocButton" type="button" data-i18n="exportWord">Word (.docx)</button>
                  <button id="exportPdfButton" type="button" data-i18n="exportPdf">PDF</button>
                </div>
              </details>
            </div>
            <div class="summary" id="summary"></div>
          </div>
        </section>
      </section>

      <aside class="sidebar">
        <div class="panel compact">
          <h2 data-i18n="meetingQueue">会议队列</h2>
          <div class="meeting-filters">
            <label>
              <span data-i18n="searchTitle">标题搜索</span>
              <input id="meetingSearch" type="search" placeholder="输入会议标题" data-i18n-placeholder="searchTitlePlaceholder">
            </label>
            <label>
              <span data-i18n="speakerFilter">说话人</span>
              <select id="meetingSpeakerFilter"></select>
            </label>
            <div class="date-filter-grid">
              <label>
                <span data-i18n="dateFrom">开始日期</span>
                <input id="meetingDateFrom" type="text" inputmode="numeric" maxlength="10" placeholder="YYYY-MM-DD" data-i18n-placeholder="datePlaceholder">
              </label>
              <label>
                <span data-i18n="dateTo">结束日期</span>
                <input id="meetingDateTo" type="text" inputmode="numeric" maxlength="10" placeholder="YYYY-MM-DD" data-i18n-placeholder="datePlaceholder">
              </label>
            </div>
            <div class="filter-actions">
              <span id="meetingFilterCount"></span>
              <button class="link-button compact-link" id="clearMeetingFilters" type="button" data-i18n="clearFilters">清除筛选</button>
            </div>
          </div>
          <div class="meeting-list" id="meetingList"></div>
        </div>
        <div class="panel compact">
          <h2 data-i18n="runtimeStatus">运行状态</h2>
          <div class="log" id="log"></div>
        </div>
      </aside>
    </main>

    <template id="segmentTemplate">
      <article class="segment-row">
        <div class="time"></div>
        <input class="speaker-input" type="text" placeholder="姓名" data-i18n-placeholder="namePlaceholder">
        <textarea class="text-input" rows="2"></textarea>
      </article>
    </template>

    <dialog class="vocabulary-dialog" id="vocabularyDialog">
      <div class="dialog-head">
        <div>
          <h2 data-i18n="hotwordsLabel">本次会议热词</h2>
          <p id="vocabularyDialogCount">0/200 · 仅用于当前会议</p>
        </div>
        <button class="icon-close" id="closeVocabularyButton" type="button" aria-label="关闭" data-i18n-aria-label="close">×</button>
      </div>
      <div class="vocabulary-table">
        <div class="vocabulary-table-head">
          <span data-i18n="vocabularyColumn">词汇</span>
          <span data-i18n="typeColumn">类型</span>
          <span></span>
        </div>
        <div class="vocabularyRows" id="vocabularyRows"></div>
      </div>
      <button class="link-button" id="addVocabularyRowButton" type="button" data-i18n="addVocabularyRow">+ 添加</button>
      <div class="dialog-actions">
        <button class="button ghost" id="clearVocabularyButton" type="button" data-i18n="clear">清空</button>
        <button class="button primary" id="saveVocabularyButton" type="button" data-i18n="saveHotwords">保存热词</button>
      </div>
    </dialog>

    <script src="/app.js" type="module"></script>
  </body>
</html>
